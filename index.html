<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ballista Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen auto-battler. Glass HUD with both tacticians' HP and the phase clock, the night-arena canvas, and a planning dock (shop, mounts, bench, cores) that folds to one line while combat runs. Deliberately single dark theme. */
:root{
  --void:#020107;
  --glass:#0c0918;
  --glass-hi:#151030;
  --line:#3d3470;
  --ink:#ece8ff;
  --muted:#aaa3cf;
  --hex:#4aa8ff;
  --volt:#ff5a3c;
  --warn:#ffc46b;
  --ok:#7dffb0;
  --bz:#b08a4c;
  --bz-hi:#e8c98a;
  --bz-lo:#5a3f1c;
  --cr:#3ec8e6;
  --ether:#eef6ff;
  --gild:linear-gradient(135deg,#e8c98a 0%,#b08a4c 30%,#f3dfae 50%,#8a6530 72%,#e8c98a 100%);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-ui:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:10px;box-sizing:border-box;max-width:1280px;margin:0 auto;transition:max-width .5s ease}
.app.battle{max-width:none}
.app.battle header.hud{padding-block:5px}
.app.battle .dock{padding-block:6px}
.panel{position:relative;background:linear-gradient(180deg,var(--glass-hi),var(--glass)) padding-box,var(--gild) border-box;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(5,3,11,.9),inset 0 0 0 2px rgba(232,201,138,.28),0 0 28px rgba(62,200,230,.08)}
.panel::before,.panel::after{content:"";position:absolute;top:50%;width:9px;height:9px;transform:translateY(-50%) rotate(45deg);background:var(--gild);box-shadow:0 0 8px rgba(62,200,230,.6);pointer-events:none;z-index:2}
.panel::before{left:-5px}
.panel::after{right:-5px}
header.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:8px 16px}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.r{align-items:flex-end}
.tname{display:flex;gap:10px;align-items:baseline;min-width:0}
.team.r .tname{flex-direction:row-reverse}
.tname b{font:900 17px var(--f-display);letter-spacing:.16em}
.team.l .tname b{color:var(--hex);text-shadow:0 0 14px rgba(74,168,255,.65)}
.team.r .tname b{color:var(--volt);text-shadow:0 0 14px rgba(255,90,60,.65)}
.tname span{font:600 11px var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tname span.you{color:var(--ink)}
.hprow{display:flex;gap:8px;align-items:center;width:100%;max-width:360px}
.team.r .hprow{flex-direction:row-reverse}
.hpbar{flex:1;height:12px;background:#0a0716 padding-box,var(--gild) border-box;border:1.5px solid transparent;overflow:hidden;display:flex;position:relative;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 50%,calc(100% - 4px) 100%,4px 100%,0 50%)}
.hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 6px,rgba(255,255,255,0) 6px 14px);pointer-events:none}
.team.r .hpbar{justify-content:flex-end}
.hpbar i{display:block;height:100%;width:100%;transition:width .4s}
.team.l .hpbar i{background:linear-gradient(180deg,#ffb3f0 0%,var(--hex) 45%,#6a0c5c 100%);box-shadow:0 0 12px var(--hex)}
.team.r .hpbar i{background:linear-gradient(180deg,#b8f6ff 0%,var(--volt) 45%,#0a5466 100%);box-shadow:0 0 12px var(--volt)}
.hpnum{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:50%;font:900 12px var(--f-display);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 2px #000;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 28%),radial-gradient(circle at 50% 50%,var(--g) 0,#0a0716 92%) padding-box,var(--gild) border-box;border:2px solid transparent;box-shadow:0 0 14px var(--g),inset 0 -6px 10px rgba(0,0,0,.6)}
.team.l .hpnum{--g:var(--hex)}
.team.r .hpnum{--g:var(--volt)}
.sub{font:700 10px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--bz-hi);white-space:nowrap;font-variant-numeric:tabular-nums}
.clock{text-align:center;min-width:150px;padding:6px 18px;background:rgba(5,3,11,.6) padding-box,var(--gild) border-box;border:1.5px solid transparent;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.time{font:900 28px var(--f-display);letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1;color:var(--ether);text-shadow:0 0 14px rgba(62,200,230,.6)}
.time.hot{color:var(--warn);text-shadow:0 0 18px rgba(255,196,107,.8)}
.rnd{font:700 10px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--bz-hi);margin-top:5px;white-space:nowrap}
.stage{flex:1;min-height:180px;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:manipulation;max-width:100%;border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 0 50px rgba(74,168,255,.12),0 0 70px rgba(255,90,60,.08)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card{pointer-events:auto;width:min(680px,calc(100% - 20px));max-height:calc(100% - 10px);overflow-y:auto;box-sizing:border-box;padding:22px 26px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(21,16,48,.97),rgba(9,7,20,.97)) padding-box,var(--gild) border-box;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(5,3,11,.9),inset 0 0 0 2px rgba(232,201,138,.3),inset 0 0 40px rgba(62,200,230,.06),0 30px 80px rgba(0,0,0,.8)}
.card.narrow{width:min(520px,calc(100% - 20px))}
.card.post{width:min(1060px,calc(100% - 16px));padding:14px 20px;gap:8px}
.card.post h1{font-size:26px}
.pwhy p{margin:0 0 3px;font-size:13px;max-width:none;color:#e6e2ff}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcol h2{margin-bottom:4px}
.pw{display:grid;grid-template-columns:52px minmax(120px,1.5fr) 1fr 66px 78px;align-items:center;gap:6px;padding:2px 4px;font-size:11.5px;background:rgba(0,0,0,.3);margin-bottom:2px}
.pw.empty,.pw.idle{opacity:.55}
.pw .pl{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.pw .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw .pn i{font-style:normal}
.pb{display:block;height:7px;background:rgba(255,255,255,.08)}
.pb i{display:block;height:100%}
.pv{text-align:right;font-variant-numeric:tabular-nums}
.pv em{font-style:normal;color:var(--muted);font-size:10px}
.pk{color:var(--muted);font-size:10px;text-align:right;white-space:nowrap}
.mvp{color:#ffd23a;font-size:9px;letter-spacing:.1em}
.idl{color:#ff8a8a;font-size:9px;letter-spacing:.1em}
@media(max-width:820px){.pcols{grid-template-columns:1fr}}
.kicker{font:700 11px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--bz-hi)}
.card h1{margin:0;font:900 32px var(--f-display);letter-spacing:.06em;text-transform:uppercase;line-height:1.1;background:linear-gradient(180deg,#fff6dc 0%,#e8c98a 40%,#9ff0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance;filter:drop-shadow(0 0 10px rgba(62,200,230,.35))}
.card h2{margin:0;font:700 12px var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--bz-hi)}
.card p{margin:0;line-height:1.5;max-width:64ch}
.card .hint{color:var(--muted);font-size:13px}
.card .warn{color:var(--warn)}
.rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px}
.rules li{padding-left:14px;position:relative;line-height:1.4}
.rules li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;transform:rotate(45deg);background:var(--gild);box-shadow:0 0 6px rgba(62,200,230,.6)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(232,201,138,.35);min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ether);background:linear-gradient(180deg,#1b1533,#0c0918) padding-box,var(--gild) border-box;border:1.5px solid transparent;padding:10px 14px;cursor:pointer;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);white-space:nowrap}
.btn:hover:not(:disabled){box-shadow:inset 0 0 14px rgba(62,200,230,.35),0 0 18px rgba(62,200,230,.3);color:#fff}
.btn.prime{background:linear-gradient(180deg,#9ff0ff 0%,#3ec8e6 45%,#0e5566 100%) padding-box,var(--gild) border-box;color:#05030b;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.prime:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.quiet{background:transparent padding-box,linear-gradient(135deg,rgba(232,201,138,.5),rgba(176,138,76,.3)) border-box;color:var(--muted)}
.btn.small{padding:8px 11px;font-size:11px}
.btn b{color:var(--warn)}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;background:#07050f padding-box,var(--gild) border-box;border:1.5px solid transparent;color:var(--ink);font:700 16px var(--f-display);letter-spacing:.24em;text-transform:uppercase;padding:8px 10px}
.join input:focus{outline:2px solid var(--volt);outline-offset:1px}
.code{font:900 40px var(--f-display);letter-spacing:.2em;color:var(--ether);text-shadow:0 0 18px rgba(62,200,230,.6),0 0 30px rgba(232,201,138,.35);user-select:all;-webkit-user-select:all}
/* planning dock */
.dock{display:flex;flex-direction:column;gap:8px;padding:10px 14px;max-height:50vh;overflow-y:auto}
.eco{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px;min-width:70px}
.stat span{font:700 10px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--bz-hi);white-space:nowrap}
.stat b{font:900 22px var(--f-display);font-variant-numeric:tabular-nums;color:var(--warn);line-height:1.1;text-shadow:0 0 12px rgba(255,196,107,.5)}
.stat em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.stat.grow{flex:1;min-width:150px}
.xpbar{height:7px;background:#0a0716 padding-box,var(--gild) border-box;border:1px solid transparent;margin-block:3px;clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 50%,calc(100% - 3px) 100%,3px 100%,0 50%)}
.xpbar i{display:block;height:100%;background:linear-gradient(180deg,#d6fbff,var(--cr) 50%,#0e5566)}
.spacer{flex:1}
.shop{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.unit{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;padding:8px 10px 8px;background:linear-gradient(180deg,#171236,#0b0816) padding-box,var(--gild) border-box;border:2px solid transparent;color:var(--ink);cursor:pointer;font-family:var(--f-ui);min-width:0;box-shadow:inset 0 0 0 1px rgba(5,3,11,.9),inset 0 0 0 2px color-mix(in srgb,var(--t) 55%,transparent),inset 0 0 22px -8px var(--t)}
.unit::after{content:"";position:absolute;right:6px;bottom:6px;width:7px;height:7px;transform:rotate(45deg);background:var(--t);box-shadow:0 0 8px var(--t);pointer-events:none}
.unit:hover:not(:disabled){box-shadow:inset 0 0 0 1px rgba(5,3,11,.9),inset 0 0 0 2px var(--t),inset 0 0 28px -6px var(--t),0 0 16px -4px var(--t)}
.unit:disabled{cursor:not-allowed;opacity:.5}
.unit .un{display:flex;justify-content:space-between;gap:6px;padding:3px 6px;margin:-2px -4px 0;font:700 12px var(--f-display);letter-spacing:.04em;background:linear-gradient(90deg,rgba(232,201,138,.18),rgba(62,200,230,.12));border-bottom:1px solid rgba(232,201,138,.35)}
.unit .un em{font-style:normal;color:var(--warn);font-variant-numeric:tabular-nums}
.unit .ut{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .ud{font-size:12px;color:var(--muted);line-height:1.2}
.unit .own{position:absolute;top:-2px;left:-2px;font:700 10px var(--f-display);background:var(--gild);color:#05030b;padding:1px 6px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.unit.sold{background:rgba(5,3,11,.5);border:1px dashed rgba(232,201,138,.3);color:var(--muted);cursor:default;align-items:center;justify-content:center;box-shadow:none;min-height:58px;font:700 11px var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.unit.sold::after{display:none}
.zones{display:grid;grid-template-columns:5fr 4fr 3fr;gap:12px}
.zl{font:700 10px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--bz-hi);margin-bottom:4px;white-space:nowrap}
.g{display:grid;gap:5px}
.g10{grid-template-columns:repeat(5,1fr)}
.g8{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(3,1fr)}
.chip{position:relative;min-height:42px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:3px 7px;background:linear-gradient(180deg,#120d26,#0b0816) padding-box,linear-gradient(135deg,var(--bz-hi),var(--bz-lo)) border-box;border:1.5px solid transparent;color:var(--ink);cursor:pointer;font-family:var(--f-ui);min-width:0;text-align:left;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t,transparent) 45%,transparent),inset 0 0 14px -8px var(--t,transparent)}
.chip.empty{background:rgba(5,3,11,.5) padding-box,linear-gradient(135deg,rgba(232,201,138,.3),rgba(90,63,28,.3)) border-box;border-style:dashed;color:var(--muted)}
.chip.sel{outline:2px solid var(--ether);outline-offset:1px;box-shadow:0 0 16px rgba(62,200,230,.6)}
.chip.target{background:linear-gradient(180deg,#120d26,#0b0816) padding-box,linear-gradient(135deg,#9ff0ff,#3ec8e6) border-box;border-style:dashed}
.chip:disabled{cursor:default}
.chip .cn{font:700 11px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cs{font-size:10px;letter-spacing:.06em}
.chip .ml{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.unit .ti{position:absolute;right:8px;top:30px;width:58px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 4px #000);pointer-events:none}
.unit .ud{padding-right:62px}
.chip .ti{position:absolute;right:3px;bottom:2px;width:34px;height:26px;object-fit:contain;filter:drop-shadow(0 1px 2px #000);pointer-events:none}
.chip .ti.core{width:26px;height:26px;border-radius:50%;bottom:auto;top:50%;transform:translateY(-50%)}
.chip .ci{position:absolute;right:5px;top:5px;display:flex;gap:5px}
.chip .ci i{width:9px;height:9px;transform:rotate(45deg);box-shadow:0 0 5px currentColor;cursor:grab;touch-action:none;outline:1px solid rgba(255,255,255,.35)}
.chip .ci i:hover{outline-color:#fff;box-shadow:0 0 9px #fff}
.chip .kb{display:inline-block;margin-left:3px;padding:0 4px;border:1px solid var(--bz-hi);color:var(--ink);font-size:9px;letter-spacing:0}
.sc{position:relative;display:flex}.sc>.unit{flex:1;min-width:0}
.lockb{position:absolute;right:5px;top:5px;z-index:2;font:700 8px var(--f-display);letter-spacing:.1em;padding:2px 5px;border:1px solid var(--bz-hi);background:#0b0816;color:var(--muted);cursor:pointer}
.lockb.on{color:var(--warn);border-color:var(--warn);box-shadow:0 0 8px rgba(255,200,80,.5)}
.drop{outline:2px dashed var(--ether);outline-offset:1px;background-color:rgba(62,200,230,.12)}
[data-act^="slot:i:"]{touch-action:none}
.upgs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upgs .zl{margin:0}.upgs .h{color:var(--muted);font-size:12px}
.upg .pips{letter-spacing:.1em;color:var(--ether);font-size:9px}
.calls{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.call kbd{font:700 10px var(--f-display);border:1px solid var(--bz-hi);padding:0 4px}
.call.dim{opacity:.55}.call.cool{opacity:.4}
.selbar{display:flex;gap:10px;align-items:center;min-height:30px;font-size:13px;flex-wrap:wrap}
.selbar .m{color:var(--warn)}
.selbar .h{color:var(--muted)}
.odds{font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.cline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
.cline b{font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:80;max-width:310px;padding:10px 12px;background:linear-gradient(180deg,rgba(24,18,54,.98),rgba(9,7,20,.97)) padding-box,var(--gild) border-box;border:1.5px solid transparent;box-shadow:0 10px 34px rgba(0,0,0,.7);font:500 12.5px/1.4 var(--f-ui);color:var(--ink);pointer-events:none}
#tip[hidden]{display:none}
#tip .tn{font:700 14px var(--f-display);letter-spacing:.03em}
#tip .ts{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#tip .tg{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:6px 0;font-variant-numeric:tabular-nums}
#tip .tg span:nth-child(odd){color:var(--muted)}
#tip .tl{margin-top:3px;color:var(--muted)}
#tip .tl.on{color:#9ff0ff}
#tip .tl.max{color:#ffd23a}
#tip .tl b{color:var(--ink)}
button:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
table.stats{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.stats th:first-child{text-align:left;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
table.stats thead th{font:900 12px var(--f-display);letter-spacing:.1em}
.rounds{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;font-size:12px}
.rr{display:grid;grid-template-columns:36px 1fr 1fr 1fr;gap:8px;padding:3px 6px;background:rgba(0,0,0,.3)}
.rr i{font-style:normal;font-variant-numeric:tabular-nums}
.setrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px}
.setrow label{display:flex;gap:8px;align-items:center;white-space:nowrap}
.setrow input[type=range]{width:120px;accent-color:var(--hex)}
.setrow input[type=checkbox]{accent-color:var(--volt);width:16px;height:16px}
.sound{position:absolute;right:6px;bottom:6px;z-index:3;display:flex;gap:12px;align-items:center;padding:4px 12px 4px 4px;font:700 10px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--bz-hi)}
.sound::before,.sound::after{display:none}
.sound label{display:flex;gap:8px;align-items:center;white-space:nowrap}
.sound input[type=range]{width:96px;accent-color:var(--cr);cursor:pointer}
.sound input[type=range]:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
@media (max-width:760px){
  .shop{grid-template-columns:repeat(3,1fr)}
  .zones{grid-template-columns:1fr}
  .modes,.rules{grid-template-columns:1fr}
  .time{font-size:22px}
  .clock{min-width:96px}
  .tname b{font-size:13px}
  .tname span,.sub{display:none}
  .card h1{font-size:23px}
  .code{font-size:30px}
  .hpnum{display:none}
  .dock{max-height:56vh}
  .sound{gap:8px;padding-right:8px}
  .sound input[type=range]{width:64px}
}
</style>

<div class="app">
  <header class="hud panel">
    <div class="team l">

      const wc = r.w < 0 ? 'var(--muted)' : SIDES[r.w].c;
      h += '<div class="rr"><b>R' + r.r + '</b><span style="color:' + wc + '">' + (r.w < 0 ? 'Draw' : SIDES[r.w].name + ' +' + r.dmg) + '</span><span><i style="color:' + SIDES[0].c + '">' + r.keep[0] + '</i> / <i style="color:' + SIDES[1].c + '">' + r.keep[1] + '</i> keep</span><span><i style="color:' + SIDES[0].c + '">' + r.kills[0] + '</i> / <i style="color:' + SIDES[1].c + '">' + r.kills[1] + '</i> kills</span></div>';
    }

}
function menuHtml() {
  return '<div class="kicker">Paused for you only · the match keeps running</div><h1>Menu</h1>' +
    '<div class="btns"><button class="btn prime" data-act="resume" type="button">Resume</button><button class="btn" data-act="stats" type="button">Match stats</button></div>' +
    '<h2>Audio</h2><div class="setrow">' +
      '<label>Music <input type="range" id="mVolMusic" min="0" max="100" value="' + Math.round(VOL.music * 100) + '" aria-label="Music volume"></label>' +
      '<label>Effects <input type="range" id="mVolFx" min="0" max="100" value="' + Math.round(VOL.fx * 100) + '" aria-label="Effects volume"></label>' +
      '<button class="btn small" data-act="mute" type="button">' + (muted ? 'Unmute' : 'Mute') + '</button></div>' +
    '<h2>Video</h2><div class="setrow">' +
      '<label><input type="checkbox" id="mShake"' + (VIDEO.shake ? ' checked' : '') + '> Screen shake</label>' +
      '<label><input type="checkbox" id="mLow"' + (VIDEO.low ? ' checked' : '') + '> Reduced effects (fewer particles, no smoke)</label></div>' +
    '<h2>Leave</h2><p class="hint">' + (S.mode === 'cpu' ? 'Leaving ends this match against the CPU.' : 'Leaving forfeits the match for your rival.') + '</p>' +
    '<div class="btns"><button class="btn" data-act="leave" type="button">Leave game</button><button class="btn quiet" data-act="menu" type="button">Main menu</button></div>';
}
function postHtml() {
  const P = S.post, nm = i => SIDES[i].name, sd = P.s;
  const mx = Math.max(1, ...sd.flatMap(x => x.sl.map(y => y ? y[2] : 0)));
  const rowT = (lab, f) => '<tr><th>' + lab + '</th><td style="color:' + SIDES[0].c + '">' + f(0) + '</td><td style="color:' + SIDES[1].c + '">' + f(1) + '</td></tr>';
  const col = i => {
    const x = sd[i], tot = Math.max(1, x.d), best = Math.max(...x.sl.map(y => y ? y[2] : 0));
    let h = '<div class="pcol"><h2 style="color:' + SIDES[i].c + '">' + nm(i) + ' · weapons by slot</h2>';
    x.sl.forEach((y, k) => {
      if (!y) { h += '<div class="pw empty"><span class="pl">' + MOUNT_LABEL[k] + '</span><span class="pn">empty</span></div>'; return; }
      const R = ROSTER[y[0]], pct = Math.round(100 * y[2] / tot), idle = y[2] === 0, mvp = !idle && y[2] === best;
      h += '<div class="pw' + (idle ? ' idle' : '') + '"><span class="pl">' + MOUNT_LABEL[k] + '</span><span class="pn" style="color:' + TIER_C[R.tier] + '">' + R.name + ' <i style="color:' + STAR_C[y[1]] + '">' + '★'.repeat(y[1]) + '</i>' + (mvp ? ' <b class="mvp">MVP</b>' : '') + (idle ? ' <b class="idl">IDLE</b>' : '') + '</span>' +
        '<span class="pb"><i style="width:' + Math.round(100 * y[2] / mx) + '%;background:' + SIDES[i].c + '"></i></span><span class="pv">' + y[2] + ' <em>' + pct + '%</em></span><span class="pk">' + y[3] + ' hit · ' + y[4] + ' kill</span></div>';
    });
    if (x.st) h += '<div class="pw"><span class="pl">Storm</span><span class="pn">Trait lightning</span><span class="pb"><i style="width:' + Math.round(100 * x.st / mx) + '%;background:' + SIDES[i].c + '"></i></span><span class="pv">' + x.st + ' <em>' + Math.round(100 * x.st / tot) + '%</em></span><span class="pk">– · ' + x.sk + ' kill</span></div>';
    return h + '</div>';
  };
  return '<div class="kicker">Round ' + P.r + ' · After-action report · ' + P.t + 's of combat</div><h1>' + P.head + '</h1>' +
    '<div class="pwhy">' + P.ln.map(t => '<p>' + t + '</p>').join('') + '</div>' +
    '<table class="stats"><thead><tr><th></th><th style="color:' + SIDES[0].c + '">' + nm(0) + '</th><th style="color:' + SIDES[1].c + '">' + nm(1) + '</th></tr></thead><tbody>' +
      rowT('Hits landed', i => sd[i].h) + rowT('Damage dealt', i => sd[i].d) + rowT('Kills', i => sd[i].k) + rowT('Keep HP left', i => sd[i].kp) + rowT('Enemies leaked into own keep', i => sd[i].nl) +
    '</tbody></table>' +
    '<div class="pcols">' + col(0) + col(1) + '</div>' +
    ((S.mode === 'cpu' || S.mode === 'host') ? '<div class="btns"><button class="btn prime" data-act="skipres" type="button">Next round ▸</button></div>' : '<p class="hint">Next round starts shortly.</p>');
}
function showOverlay() {
  $('overlay').innerHTML = '';
  const ph = S.phase, mode = S.mode;
  if (S.ui.menu && inMatch()) {
    card(menuHtml(), true);
    const mm = $('mVolMusic'), mf = $('mVolFx');
    if (mm) mm.addEventListener('input', e => { VOL.music = clamp((+e.target.value || 0) / 100, 0, 1); $('volMusic').value = e.target.value; applyVolumes(); });
    if (mf) mf.addEventListener('input', e => { VOL.fx = clamp((+e.target.value || 0) / 100, 0, 1); $('volFx').value = e.target.value; applyVolumes(); });
    if ($('mShake')) $('mShake').addEventListener('change', e => { VIDEO.shake = !!e.target.checked; saveVideo(); });
    if ($('mLow')) $('mLow').addEventListener('change', e => { VIDEO.low = !!e.target.checked; saveVideo(); });
    return;
  }
  if (S.ui.tab && inMatch() && ph !== 'over') {
    card('<div class="kicker">Round ' + S.round + ' · ' + (ph === 'setup' ? 'Planning' : ph === 'combat' ? 'Combat' : ph) + '</div><h1>Match stats</h1>' + statsHtml(false) +
      '<div class="btns"><button class="btn quiet" data-act="stats" type="button">Close · Tab</button></div>');
    return;
  }
  if (postOn() && inMatch() && !S.ui.menu && !S.ui.tab) { card(postHtml()).classList.add('post'); return; }
  if (mode === 'demo') {
    const online = roomChecked && roomNS;
    card(
      '<div class="kicker">2187 · The powder age never ended</div>' +
      '<h1>Ballista Keep</h1>' +
      '<p>Two keeps, ten turret mounts each, and armies that march on their own. You plan for 60 seconds, then 30 seconds of combat plays out without you. Draft well, and your build holds while theirs breaks.</p>' +
      '<ul class="rules">' +
        '<li>Buy turrets from a shop of five. Reroll for 2 gold</li>' +
        '<li>Three copies merge into 2 stars, three 2-stars into 3</li>' +
        '<li>Your level is how many turrets you can field. Buy XP for 4</li>' +
        '<li>Matching traits unlock bonuses: Kinetic, Sniper, Storm and more</li>' +
        '<li>Cores dropped in combat fit onto turrets, up to 3 each</li>' +
        '<li>Bank gold for interest: +1 per 10, up to 5. Streaks pay too</li>' +
        '<li>Lose a round and you lose HP. Last tactician standing wins</li>' +
        '<li>Each round’s armies hit harder than the last</li>' +
      '</ul>' +
      '<div class="modes">' +
        '<div class="mode"><h2>Against the CPU</h2><p class="hint">The CPU runs VOLT on the right. Hard reads your last round, fits turrets to mounts and gets +5 gold a round.</p><div class="btns"><button class="btn" data-act="cpu:easy" type="button">Easy</button><button class="btn prime" data-act="cpu:hard" type="button">Hard</button></div></div>' +
        '<div class="mode"><h2>Against a friend</h2>' +
          (online ? '<div class="btns"><button class="btn" data-act="host" type="button">Create room</button></div>' +
            '<div class="join"><input id="codeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="8" placeholder="Room code" aria-label="Room code"><button class="btn" data-act="join" type="button">Join</button></div>' +
            (S.joinErr ? '<p class="warn">' + S.joinErr + '</p>' : '')
          : '<p class="hint">' + (roomChecked ? 'Online play couldn’t load. Check your connection and reload the page.' : 'Connecting to rooms…') + '</p>') +
        '</div>' +
      '</div>' +
      '<p class="hint">Turn up the music with the volume controls at the bottom right. ' + (peerMode() ? 'To play a friend, send them this page’s link and your room code.' : 'A friend needs access to this page (Share menu) and must be signed in.') + '</p>'
    );
    return;
  }
  if (ph === 'lobby') {
    card('<div class="kicker">Room open</div><h1>Send the code</h1>' +
      (net ? '<div class="code" id="codeShow">' + net.code + '</div><div class="btns"><button class="btn" data-act="copy" type="button">Copy code</button></div>' +
        '<p>Your rival opens this same page, chooses Join under Against a friend, and types the code. You run HEX on the left. Planning starts as soon as they arrive.</p>' +
        '<p class="hint">' + (peerMode() ? 'Send them this page’s link too. Keep this screen open until they join.' : 'They need access to this page (share it from the Share menu) and must be signed in.') + '</p>'
        : '<p>' + (S.netMsg || 'Opening the arena…') + '</p>') +
      '<div class="btns"><button class="btn quiet" data-act="menu" type="button">Cancel</button></div>', true);
  } else if (ph === 'connecting' || ph === 'joined') {
    const slow = ph === 'connecting' && performance.now() - S.connectAt > 8000;
    card('<div class="kicker">Room ' + (S.code || '') + '</div><h1>' + (ph === 'joined' ? 'Entering the arena' : 'Looking for the room') + '</h1>' +
      '<p>' + (ph === 'joined' ? 'Found your rival. Planning is about to start.' : slow ? 'No room has answered with this code yet. Check it with your rival, or keep waiting.' : 'Connecting…') + '</p>' +
      '<div class="btns"><button class="btn quiet" data-act="menu" type="button">Back</button></div>', true);
  } else if (ph === 'over') {
    const me = S.me, w = S.winner;
    const title = me < 0 ? (w < 0 ? 'Dead even' : SIDES[w].name + ' wins') : w === me ? 'Victory' : w < 0 ? 'Dead even' : 'Defeat';
    const P = me >= 0 ? S.p[me] : null;
    let btns = '';
    if (mode === 'cpu') btns = '<button class="btn prime" data-act="again" type="button">Run it back</button>';
    else if (mode === 'host') { const g = guestPresence(); btns = net && net.rematch ? '<button class="btn" type="button" disabled>Waiting for rival…</button>' : '<button class="btn prime" data-act="again" type="button">' + (g && g.r ? 'Accept rematch' : 'Rematch') + '</button>'; }
    else if (mode === 'guest' && me >= 0) btns = net && net.in.r ? '<button class="btn" type="button" disabled>Waiting for rival…</button>' : '<button class="btn prime" data-act="again" type="button">' + (S.hostRematch ? 'Accept rematch' : 'Rematch') + '</button>';
    card('<div class="kicker">Match over · ' + S.round + ' rounds</div><h1>' + title + '</h1>' +
      (P ? '<p>You finished on ' + Math.max(0, Math.ceil(P.hp)) + ' HP at level ' + P.level + ', with ' + P.kills + ' kills across the match.</p>' : '') +
      '<div class="btns">' + btns + '<button class="btn quiet" data-act="menu" type="button">Main menu</button></div>' +
      '<h2>Match summary</h2>' + statsHtml(true));
  } else if (ph === 'gone') {
    card('<h1>Rival left</h1><p>The other keep is empty. Head back to choose another match.</p><div class="btns"><button class="btn" data-act="menu" type="button">Main menu</button></div>', true);
  } else if (ph === 'neterr') {
    card('<h1>Signal lost</h1><p>' + (S.netMsg || 'Something went wrong with the room.') + '</p><div class="btns"><button class="btn" data-act="menu" type="button">Main menu</button></div>', true);
  }
}
function selectCode() { const n = $('codeShow'); if (!n) return; const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function startCpu(diff) { leaveRoom(); newMatch('cpu', diff); }
function onAct(a, btn) {
  audio();
  const parts = String(a).split(':'), k0 = parts[0];
  if (k0 === 'resume') S.ui.menu = false;
  else if (k0 === 'skipres') { if (S.phase === 'result' && (S.mode === 'cpu' || S.mode === 'host')) S.phaseT = Math.min(S.phaseT, 0.1); }
  else if (k0 === 'stats') { S.ui.menu = false; S.ui.tab = !S.ui.tab; }
  else if (k0 === 'leave') { leaveRoom(); newMatch('demo'); }
  else if (k0 === 'cpu') startCpu(parts[1]);
  else if (k0 === 'host') { S.joinErr = ''; hostRoom(); }
  else if (k0 === 'join') { const v = $('codeIn') ? $('codeIn').value : ''; S.joinErr = ''; joinRoom(v); }
  else if (k0 === 'slot') onSlot(parts[1], parts[2] | 0);
  else if (k0 === 'buy') act({t: 'buy', i: parts[1] | 0});
  else if (k0 === 'lock') act({t: 'lock', i: parts[1] | 0});
  else if (k0 === 'strip') { const sel = S.ui.sel; if (sel && sel.z !== 'i') act({t: 'strip', f: sel.z, i: sel.i}); }
  else if (k0 === 'upg') act({t: 'upg', i: parts[1] | 0});
  else if (k0 === 'call') act({t: 'call', i: parts[1] | 0});
  else if (k0 === 'reroll') act({t: 'reroll'});
  else if (k0 === 'xp') act({t: 'xp'});
  else if (k0 === 'ready') { act({t: 'ready'}); S.ui.sel = null; }
  else if (k0 === 'unready') act({t: 'unready'});
  else if (k0 === 'sell') { const sel = S.ui.sel; if (sel && sel.z !== 'i') act({t: 'sell', f: sel.z, i: sel.i}); S.ui.sel = null; }
  else if (k0 === 'mute') setMute(!muted);
  else if (k0 === 'copy') { try { navigator.clipboard.writeText(net.code).then(() => { if (btn) btn.textContent = 'Copied'; }, selectCode); } catch (e) { selectCode(); } }
  else if (k0 === 'again') {
    if (S.mode === 'cpu') startCpu(S.diff);
    else if (S.mode === 'host' && net) net.rematch = true;
    else if (S.mode === 'guest' && net) net.in.r = 1;
  } else if (k0 === 'menu') { leaveRoom(); newMatch('demo'); }
  if (S.ui) { if (k0 !== 'stats' && k0 !== 'resume' && k0 !== 'mute') S.ui.menu = false; if (k0 !== 'stats') S.ui.tab = false; }
  dockSig = ''; overlaySig = '';
}
for (const id of ['overlay', 'dock']) {
  $(id).addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (performance.now() < dragSup) return;
    if (b && !b.disabled) onAct(b.getAttribute('data-act'), b);
  });
}
$('overlay').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'codeIn') onAct('join'); });

$('volMusic').value = String(Math.round(VOL.music * 100));
$('volFx').value = String(Math.round(VOL.fx * 100));
$('volMusic').addEventListener('input', e => { audio(); VOL.music = clamp((+e.target.value || 0) / 100, 0, 1); applyVolumes(); });
$('volFx').addEventListener('input', e => { audio(); VOL.fx = clamp((+e.target.value || 0) / 100, 0, 1); applyVolumes(); });
$('muteBtn').addEventListener('click', () => { audio(); setMute(!muted); });
$('statsBtn').addEventListener('click', () => { audio(); S.ui.menu = false; S.ui.tab = !S.ui.tab; });
$('menuBtn').addEventListener('click', () => { audio(); S.ui.tab = false; S.ui.menu = !S.ui.menu; });
applyVolumes();
addEventListener('pointerdown', () => audio(), {once: true});
addEventListener('keydown', () => audio(), {once: true});

/* ---------- loop ---------- */
newMatch('demo');
let last = performance.now(), acc = 0;
function frame(now) {
  const rdt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  const dt = rdt * S.timeScale;
  if (S.mode === 'guest') { guestTween(dt); cosmetic(dt, rdt); }
  else {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n++ < 24) { simulate(STEP); acc -= STEP; }
    if (n >= 24) acc = 0;
    cosmetic(dt, rdt);
  }
  netTick(now);
  render();
  updateHUD();
  const sig = sigNow();
  if (sig !== overlaySig) { overlaySig = sig; showOverlay(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
