<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Of Blood &amp; Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen auto-battler. Glass HUD with both tacticians' HP and the phase clock, the night-arena canvas, and a planning dock (shop, mounts, bench, cores) that folds to one line while combat runs. Deliberately single dark theme. */
:root{
  --void:#020107;
  --glass:#0c0918;
  --glass-hi:#151030;
  --line:#3d3470;
  --ink:#ece8ff;
  --muted:#aaa3cf;
  --hex:#4aa8ff;
  --azure:#42D8FF;--verm:#FF7969;--gold:#E8C76A;--muted2:#B8BBDD;--win:#5BF0AD;--loss:#FF6D69;
  --volt:#ff5a3c;
  --warn:#ffc46b;
  --ok:#7dffb0;
  --bz:#b08a4c;
  --bz-hi:#e8c98a;
  --bz-lo:#5a3f1c;
  --cr:#3ec8e6;
  --ether:#eef6ff;
  --gild:linear-gradient(135deg,#fff1c8 0%,#e5bf6a 16%,#9c6f2a 36%,#f6e2a8 52%,#b8893a 70%,#fff0c4 86%,#a97a2f 100%);
  --gild-v:linear-gradient(180deg,#fff6d8 0%,#f0cf7a 38%,#c9952f 70%,#8a5f1c 100%);
  --lacquer:linear-gradient(180deg,#191342 0%,#100c26 55%,#0a0718 100%);
  --fil:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2756%27 height=%2756%27 viewBox=%270 0 56 56%27%3E%3Cg fill=%27none%27 stroke=%27%23f3dfae%27 stroke-width=%271%27%3E%3Cg stroke-opacity=%27.13%27%3E%3Ccircle cx=%2728%27 cy=%2718%27 r=%279%27/%3E%3Ccircle cx=%2738%27 cy=%2728%27 r=%279%27/%3E%3Ccircle cx=%2728%27 cy=%2738%27 r=%279%27/%3E%3Ccircle cx=%2718%27 cy=%2728%27 r=%279%27/%3E%3C/g%3E%3Cpath d=%27M28 23l5 5-5 5-5-5z%27 stroke-opacity=%27.2%27/%3E%3Cpath d=%27M0 0h56v56H0z%27 stroke-opacity=%27.05%27/%3E%3Cg stroke-opacity=%27.1%27%3E%3Cpath d=%27M0 28h9M47 28h9M28 0v9M28 47v9%27/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  --c-tl:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27 viewBox=%27-2 -2 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23fff3cf%27/%3E%3Cstop offset=%27.45%27 stop-color=%27%23e6c06a%27/%3E%3Cstop offset=%27.7%27 stop-color=%27%239a6b26%27/%3E%3Cstop offset=%271%27 stop-color=%27%23f3dfae%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg transform=%27translate(0 0)%27%3E%3Cpath d=%27M0 0H30L24 6H6V24L0 30Z%27 fill=%27url(%23g)%27 stroke=%27%232a1a05%27 stroke-width=%27.8%27/%3E%3Cpath d=%27M4 4l6-4 6 4-6 6z%27 transform=%27translate(-6 -6)%27 fill=%27%23fff3cf%27 stroke=%27%239a6b26%27 stroke-width=%27.8%27/%3E%3Cpath d=%27M9 20a7 7 0 1 1 11-5.5%27 fill=%27none%27 stroke=%27%23f3dfae%27 stroke-width=%271.4%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2720%27 cy=%2714.5%27 r=%271.4%27 fill=%27%23fff3cf%27/%3E%3C/g%3E%3C/svg%3E");--c-tr:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27 viewBox=%27-2 -2 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23fff3cf%27/%3E%3Cstop offset=%27.45%27 stop-color=%27%23e6c06a%27/%3E%3Cstop offset=%27.7%27 stop-color=%27%239a6b26%27/%3E%3Cstop offset=%271%27 stop-color=%27%23f3dfae%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg transform=%27translate(28 0) scale(-1 1)%27%3E%3Cpath d=%27M0 0H30L24 6H6V24L0 30Z%27 fill=%27url(%23g)%27 stroke=%27%232a1a05%27 stroke-width=%27.8%27/%3E%3Cpath d=%27M4 4l6-4 6 4-6 6z%27 transform=%27translate(-6 -6)%27 fill=%27%23fff3cf%27 stroke=%27%239a6b26%27 stroke-width=%27.8%27/%3E%3Cpath d=%27M9 20a7 7 0 1 1 11-5.5%27 fill=%27none%27 stroke=%27%23f3dfae%27 stroke-width=%271.4%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2720%27 cy=%2714.5%27 r=%271.4%27 fill=%27%23fff3cf%27/%3E%3C/g%3E%3C/svg%3E");--c-bl:url("data:image/svg+xml,%3Cs w3.org/2000/svg%27 width=%2714%27 height=%2714%27 viewBox=%270 0 14 14%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23fff3cf%27/%3E%3Cstop offset=%27.45%27 stop-color=%27%23e6c06a%27/%3E%3Cstop offset=%27.7%27 stop-color=%27%239a6b26%27/%3E%3Cstop offset=%271%27 stop-color=%27%23f3dfae%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%27M7 1l6 6-6 6-6-6z%27 fill=%27url(%23g)%27 stroke=%27%232a1a05%27 stroke-width=%27.8%27/%3E%3Cpath d=%27M7 4l3 3-3 3-3-3z%27 fill=%27%23fff3cf%27 opacity=%27.8%27/%3E%3C/svg%3E");
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-ui:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}

html,body,canvas{cursor:var(--cur)}
button:not(:disabled),[data-act],.lockb,.unit:not(:disabled),.chip:not(:disabled),select,input[type=range],label,.filebtn{cursor:var(--cur-hot)}
button:disabled,.btn:disabled{cursor:var(--cur)}
input[type=text]{cursor:text}
body{background:var(--void);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:10px;box-sizing:border-box;max-width:1280px;margin:0 auto;transition:max-width .5s ease}
.app.battle{max-width:none}
.app.battle header.hud{padding-block:5px}
.app.battle .dock{padding-block:6px}
.panel{position:relative;background:var(--fil) center/56px 56px repeat padding-box,radial-gradient(ellipse at 50% -20%,rgba(255,214,140,.14),transparent 55%) padding-box,var(--lacquer) padding-box,var(--gild) border-box;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(5,3,11,.95),inset 0 0 0 2px rgba(246,226,168,.35),inset 0 0 40px rgba(0,0,0,.45),0 6px 24px rgba(0,0,0,.55),0 0 28px rgba(255,196,107,.07)}
.panel::before{content:"";position:absolute;inset:-5px;pointer-events:none;z-index:3;background:var(--c-tl) left top/32px 32px no-repeat,var(--c-tr) right top/32px 32px no-repeat,var(--c-bl) left bottom/32px 32px no-repeat,var(--c-br) right bottom/32px 32px no-repeat}
.panel::after{content:"";position:absolute;inset:-7px;pointer-events:none;z-index:3;background:var(--fin) left center/14px 14px no-repeat,var(--fin) right center/14px 14px no-repeat}

header.hud{display:grid;grid-template-columns:minmax(0,1fr) clamp(170px,16vw,240px) minmax(0,1fr);gap:clamp(10px,1.4vw,22px);align-items:center;padding:10px clamp(16px,1.8vw,26px)}
header.hud::after{display:none}
.team{display:flex;flex-direction:column;gap:7px;min-width:0;position:relative;padding:6px 10px;border:1px solid rgba(246,226,168,.22);background:repeating-linear-gradient(62deg,rgba(255,255,255,.035) 0 1px,transparent 1px 26px),repeating-linear-gradient(-62deg,rgba(255,255,255,.035) 0 1px,transparent 1px 26px),rgba(5,3,14,.35)}
.team.r{align-items:flex-end}
.team.l{box-shadow:inset 0 0 50px -10px rgba(40,140,255,.35)}.team.r{box-shadow:inset 0 0 50px -10px rgba(255,80,60,.33)}
.tname{display:flex;gap:12px;align-items:baseline;min-width:0;max-width:100%}
.team.r .tname{flex-direction:row-reverse}
.tname b{font:700 clamp(18px,1.7vw,24px)/1 var(--f-display);letter-spacing:.1em;flex:none;-webkit-background-clip:text;background-clip:text;color:transparent}
.team.l .tname b{background-image:linear-gradient(180deg,#f2fbff 0%,#8ee8ff 45%,#1f93de 100%);filter:drop-shadow(0 1px 0 rgba(0,20,40,.8)) drop-shadow(0 0 10px rgba(66,216,255,.45))}
.team.r .tname b{background-image:linear-gradient(180deg,#fff0ec 0%,#ff9a8a 45%,#d23a2c 100%);filter:drop-shadow(0 1px 0 rgba(40,0,0,.8)) drop-shadow(0 0 10px rgba(255,121,105,.5))}
.tname span{font:600 11.5px var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:#d9c89a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tname span.you{color:var(--ink)}
.hprow{display:flex;gap:10px;align-items:center;width:100%}
.hpbar{flex:1;min-width:0;height:16px;border-radius:9px;background:#05070f padding-box,var(--gild) border-box;border:2px solid transparent;overflow:hidden;display:flex;position:relative;justify-content:flex-start;box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 0 0 1px rgba(5,3,11,.8)}
.hpbar::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.1) 40%,transparent 42%,rgba(0,0,0,.28) 100%),repeating-linear-gradient(100deg,transparent 0 19px,rgba(8,10,24,.6) 19px 21px);pointer-events:none}
.hpbar i{display:block;height:100%;width:100%;transition:width .4s;border-radius:7px 0 0 7px}
.team.l .hpbar i{background:linear-gradient(180deg,#c8f4ff 0%,#4fd8ff 45%,#0b6fb0 100%);box-shadow:0 0 12px rgba(66,216,255,.7)}
.team.r .hpbar i{background:linear-gradient(180deg,#ffd3cb 0%,#ff7a68 45%,#b42b22 100%);box-shadow:0 0 12px rgba(255,121,105,.65)}
.hpnum{min-width:clamp(42px,3.5vw,52px);height:clamp(42px,3.5vw,52px);padding:0 4px;box-sizing:border-box;flex:none;display:grid;place-items:center;border-radius:50%;font:900 clamp(17px,1.6vw,24px)/1 var(--f-display);font-variant-numeric:tabular-nums;color:#fff8e6;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6);border:3px solid transparent}
.team.l .hpnum{background:radial-gradient(circle at 35% 28%,#5fb0f0,#123b86 55%,#061a44 100%) padding-box,var(--gild) border-box;box-shadow:0 0 0 1px #05030b,0 0 14px rgba(66,216,255,.4),inset 0 0 0 1px rgba(255,255,255,.22),inset 0 -7px 10px rgba(0,0,0,.5)}
.team.r .hpnum{background:radial-gradient(circle at 35% 28%,#ee6a58,#7a1a1c 55%,#36070b 100%) padding-box,var(--gild) border-box;box-shadow:0 0 0 1px #05030b,0 0 14px rgba(255,121,105,.4),inset 0 0 0 1px rgba(255,255,255,.22),inset 0 -7px 10px rgba(0,0,0,.5)}
.hplab{font:700 11px var(--f-display);letter-spacing:.16em;color:#d9c89a;flex:none}
.sub{display:flex;align-items:center;gap:10px;font:700 clamp(12px,1.05vw,14px) var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#d9c89a;white-space:nowrap;font-variant-numeric:tabular-nums}
.sub i{width:4px;height:4px;transform:rotate(45deg);background:var(--gild);flex:none}
.sub .gd{color:#ffd978}
.sub .win{color:var(--win)}
.sub .loss{color:var(--loss)}
.bench{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;font-variant-numeric:tabular-nums}
.bench th,.bench td{text-align:left;padding:3px 8px;border-bottom:1px solid rgba(232,199,106,.25)}
.bench tr.rec td{color:#5bf0ad;font-weight:700}
.card>*{flex-shrink:0}

const ROUTES = [0, 1].map(side => {
  const xs = [], ys = [], cum = [];
  let px = 0, py = 0, tot = 0;

    for (let k = si ? 1 : 0; k <= 256; k++) {
      const t = k / 256, m = 1 - t, a = m * m * m, b = 3 * m * m * t, c = 3 * m * t * t, d = t * t * t;

      const x = u * W, y = v * H;
      if (xs.length) tot += Math.hypot(x - px, y - py);
      xs.push(x); ys.push(y); cum.push(tot); px = x; py = y;

const RP = {x: 0, y: 0, tx: 1, ty: 0};   // scratch result of routeAt: read it straight away
function routeAt(R, d) {
  const xs = R.xs, ys = R.ys, cum = R.cum, n = R.n;
  let i0, i1, f;
  if (d <= 0) { i0 = 0; i1 = 1; f = 0; }
  else if (d >= R.len) { i0 = n - 2; i1 = n - 1; f = 1; }
  else {
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
    i0 = lo; i1 = hi; f = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
  }
  const dx = xs[i1] - xs[i0], dy = ys[i1] - ys[i0], l = Math.hypot(dx, dy) || 1;
  RP.tx = dx / l; RP.ty = dy / l;
  if (d <= 0) { RP.x = xs[0] + RP.tx * d; RP.y = ys[0] + RP.ty * d; }          // spawn queue behind the door
  else { RP.x = xs[i0] + dx * f; RP.y = ys[i0] + dy * f; }
  return RP;
}

  return {id: s.id, side, route: side ^ 1, x, y, at: R.cum[best], off: Math.sqrt(bd)};

// anti-snowball: interest only counts gold up to the rival's pile + 10, and the poorer side gets comeback pay (+1 per 10 gold behind, max +3)
const interestFor = side => { const P = S.p[side], O = S.p[side ^ 1]; return interestOf(Math.min(P.gold, O.gold + 10)); };
const comebackFor = side => { const gap = S.p[side ^ 1].gold - S.p[side].gold; return gap >= 10 ? Math.min(3, Math.floor(gap / 10)) : 0; };
const interestOf = g => g < 4 ? 0 : Math.min(5, 1 + Math.floor((g - 4) / 6));
const BETS = [0, 5, 10, 20];
// wager odds: the favourite (HP lead, win streak) is paid less, the underdog more
function betOdds(side) {
  const P = S.p[side], O = S.p[side ^ 1];
  const score = (P.hp - O.hp) / 20 + (P.streak - O.streak) * 0.5;
  const f = clamp(1 - score * 0.12, 0.55, 1.6);
  const n = Math.max(1.2, Math.round(2 * f * 10) / 10);
  return [n, Math.round(n * 1.5 * 10) / 10];
}

$('volFx').addEventListener('input', e => { audio(); VOL.fx = clamp((+e.target.value || 0) / 100, 0, 1); applyVolumes(); });
$('muteBtn').addEventListener('click', () => { audio(); setMute(!muted); });
$('statsBtn').addEventListener('click', () => { audio(); S.ui.menu = false; S.ui.tab = !S.ui.tab; });
$('menuBtn').addEventListener('click', () => { audio(); S.ui.tab = false; S.ui.menu = !S.ui.menu; });
applyVolumes();
addEventListener('pointerdown', () => audio(), {once: true});
addEventListener('keydown', () => audio(), {once: true});

/* ---------- loop ---------- */
newMatch('demo');
/* ---------- intro film: plays on load; Esc, click, tap or the end drops to the main menu ---------- */
(function () {
  const box = document.createElement('div');
  box.id = 'intro'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Intro film. Press Escape or click to skip.');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s';
  const v = document.createElement('video');
  v.src = 'art/intro.mp4'; v.playsInline = true; v.preload = 'auto'; v.volume = 0.3;
  v.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000';
  const hint = document.createElement('div');
  hint.textContent = 'Click or press Esc to skip';
  hint.style.cssText = 'position:absolute;right:18px;bottom:14px;font:600 13px "Chakra Petch",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);text-shadow:0 1px 4px #000;pointer-events:none';
  box.append(v, hint); document.body.appendChild(box);
  let done = false;
  const end = () => {
    if (done) return; done = true;
    removeEventListener('keydown', onKey, true);
    try { v.pause(); } catch (e) {}
    box.style.opacity = '0'; box.style.pointerEvents = 'none';
    setTimeout(() => box.remove(), 550);
  };
  const onKey = e => { if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); end(); } else { e.stopImmediatePropagation(); } };
  addEventListener('keydown', onKey, true);
  box.addEventListener('pointerdown', e => { e.preventDefault(); end(); });
  v.addEventListener('ended', end);
  v.addEventListener('error', end);
  v.play().catch(() => { v.muted = true; v.play().catch(end); });   // browsers may block sound before a gesture; fall back to silent
  setTimeout(() => { if (!done && v.readyState < 2 && v.currentTime === 0) end(); }, 8000);   // never trap the player behind a stalled video
})();
pvpInit();
let last = performance.now(), acc = 0;

/* ---------- graphics test: a scripted heavy combat run at each resolution on the player's own hardware ---------- */
const GFX_RES = ['4k', '1440', '1080', '720'];
const GFX = {on: false, i: 0, warm: 0, samples: [], out: [], setup: false, prev: null, results: null};
try { GFX.results = JSON.parse(localStorage.getItem('bk-bench') || 'null'); } catch (e) {}
function gpuInfo() { try { const c = document.createElement('canvas'), gl = c.getContext('webgl'), e = gl && gl.getExtension('WEBGL_debug_renderer_info'); return e ? String(gl.getParameter(e.UNMASKED_RENDERER_WEBGL)) : 'unknown'; } catch (e) { return 'unknown'; } }
function startBench() {
  if (GFX.on) return;
  GFX.prev = {res: VIDEO.res, adapt: VIDEO.adapt};
  leaveRoom(); startCpu('hard'); S.ui.set = false;
  Object.assign(GFX, {on: true, i: 0, warm: 1.5, samples: [], out: [], setup: false});
}
function benchApply() { VIDEO.res = GFX_RES[GFX.i]; VIDEO.adapt = false; PERF.step = 0; fit(); GFX.warm = 1.5; GFX.samples = []; }
function benchStats(sm) {
  const a = sm.slice().sort((x, y) => x - y), sum = sm.reduce((x, y) => x + y, 0);
  const p99 = a[Math.min(a.length - 1, Math.floor(a.length * 0.99))];
  return {fps: Math.round(sm.length / sum * 10000) / 10, low: Math.round(1000 / p99 * 10) / 10, slow: Math.round(sm.filter(x => x > 33.4).length / sm.length * 1000) / 10, n: sm.length};
}
function benchFinish() {
  const o = GFX.out;
  let rec = '720';
  const good = o.find(r => r.fps >= 55 && r.low >= 40) || o.find(r => r.fps >= 40 && r.low >= 28);
  if (good) rec = good.res;
  GFX.results = {t: Date.now(), rec, out: o, gpu: gpuInfo(), dpr: window.devicePixelRatio || 1, screen: screen.width + 'x' + screen.height, cores: navigator.hardwareConcurrency || 0, mem: navigator.deviceMemory || 0};
  try { localStorage.setItem('bk-bench', JSON.stringify(GFX.results)); } catch (e) {}
  VIDEO.res = GFX.prev.res; VIDEO.adapt = GFX.prev.adapt; PERF.step = 0; fit();
  GFX.on = false; $('overlay').style.display = '';
  leaveRoom(); newMatch('demo'); S.ui.set = true; overlaySig = '';
}
function benchTick(raw) {
  $('overlay').style.display = 'none';
  if (!GFX.setup) {
    if (S.phase !== 'setup' && S.phase !== 'intro' && S.phase !== 'combat') return;
    for (let sd = 0; sd < 2; sd++) { const P = S.p[sd]; for (let i = 0; i < 10; i++) P.board[i] = {r: (i * 2 + sd * 5) % ROSTER.length, star: 2, items: []}; }
    startCombat(); setPhase('combat'); GFX.setup = true; benchApply(); return;
  }
  S.timeLeft = 30; S.cam = {x: W / 2, y: H / 2, z: 1}; S.titles = []; S.spawnT = 999;
  for (const sd of [0, 1]) { S.p[sd].keep = KEEP_HP; S.p[sd].shield = 0; }
  if (S.units.length < 44) for (let sd = 0; sd < 2; sd++) {
    for (let n = 0; n < 4; n++) { spawn(['trooper', 'bike', 'bulwark'][n % 3], sd); const u = S.units[S.units.length - 1]; u.hp = u.max = 1e7; u.d = rnd(0, 700); placeUnit(u); }
    for (let n = 0; n < 2; n++) { spawn('drone', sd); const u = S.units[S.units.length - 1]; u.hp = u.max = 1e7; u.d = -n * 20; placeUnit(u); }
    if (Math.random() < 0.1) { spawn('titan', sd); S.units[S.units.length - 1].hp = S.units[S.units.length - 1].max = 1e7; }
  }
  if (raw > 0.5) return;
  if (GFX.warm > 0) { GFX.warm -= raw; return; }
  GFX.samples.push(raw * 1000);
  if (GFX.samples.reduce((x, y) => x + y, 0) >= 5000) {
    GFX.out.push(Object.assign({res: GFX_RES[GFX.i]}, benchStats(GFX.samples)));
    GFX.i++;
    if (GFX.i >= GFX_RES.length) benchFinish(); else benchApply();
  }
}
function benchOverlay() {
  ctx.save(); ctx.fillStyle = 'rgba(5,4,18,.78)'; ctx.fillRect(W / 2 - 250, 70, 500, 46);
  ctx.strokeStyle = '#e8c76a'; ctx.lineWidth = 1.5; ctx.strokeRect(W / 2 - 250, 70, 500, 46);
  ctx.fillStyle = '#f3f4fc'; ctx.font = '700 17px "Chakra Petch", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Graphics test: ' + (RES[GFX_RES[Math.min(GFX.i, 3)]].name) + ' (' + (Math.min(GFX.i, 3) + 1) + ' of 4). Please keep this tab open.', W / 2, 98);
  ctx.restore();
}
function benchHtml() {
  const r = GFX.results;
  let h = '<h2>Performance</h2><div class="setrow"><button class="btn small" data-act="bench" type="button">Run graphics test (about 35 s)</button></div>';
  if (!r) return h + '<p class="hint">Plays a heavy scripted battle at each resolution on this device and recommends the sharpest one that stays smooth.</p>';
  h += '<table class="bench"><tr><th>Resolution</th><th>Avg fps</th><th>1% low</th><th>Slow frames</th><th></th></tr>' +
    r.out.map(o => '<tr' + (o.res === r.rec ? ' class="rec"' : '') + '><td>' + RES[o.res].name + '</td><td>' + o.fps + '</td><td>' + o.low + '</td><td>' + o.slow + '%</td><td>' + (o.res === r.rec ? 'recommended' : '') + '</td></tr>').join('') + '</table>' +
    '<div class="setrow"><button class="btn small prime" data-act="benchuse:' + r.rec + '" type="button">Use ' + RES[r.rec].name + '</button></div>';
  const txt = 'Of Blood & Glass graphics test | ' + r.out.map(o => o.res + ' ' + o.fps + 'fps (1% low ' + o.low + ', slow ' + o.slow + '%)').join(' | ') + ' | recommended ' + r.rec + ' | GPU ' + r.gpu + ' | screen ' + r.screen + ' @' + r.dpr + 'x | cores ' + r.cores + (r.mem ? ' | mem ' + r.mem + 'GB' : '');
  return h + '<p class="hint">Copy this line if you want to send the result to someone:</p><textarea class="benchtxt" readonly rows="3" onclick="this.select()">' + escA(txt) + '</textarea>';
}
function frame(now) {
  perfGov((now - last) / 1000);
  if (GFX.on) benchTick((now - last) / 1000);
  const rdt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  const dt = rdt * S.timeScale;
  if (S.mode === 'guest') { guestTween(dt); cosmetic(dt, rdt); }
  else {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n++ < 24) { simulate(STEP); acc -= STEP; }
    if (n >= 24) acc = 0;
    cosmetic(dt, rdt);
  }
  netTick(now);
  render();
  updateHUD();
  const sig = sigNow();
  if (sig !== overlaySig) { overlaySig = sig; showOverlay(); }
  updateWitness();
  updateTerrMenu();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
